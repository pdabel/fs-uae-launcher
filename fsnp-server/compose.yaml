# The FS-UAE netplay lobby. See README.md.
#
#   docker compose up -d        from this directory
#
# Then forward TCP 25101 (lobby and games) to this machine, and give players
# its address to add in the launcher's Settings > Net Play.
name: fs-uae-netplay

services:
  lobby:
    # Built from this checkout. To run a published image instead, replace
    # build: with image: ghcr.io/pdabel/fs-uae-netplay:<version>.
    build: .
    image: fs-uae-netplay:local
    ports:
      # The container always listens on 25101. Players are told the port the
      # host's launcher reached it on, so a different host port works too.
      - "${LOBBY_PORT:-25101}:25101"
    # environment:
    #   PUBLIC_ADDRESSES: "203.0.113.4"   # what to tell players; see README.md
    #   MAX_GAMES: "64"
    #   GAME_LAUNCH_TIMEOUT: "900"
    #   IDLE_TIMEOUT: "600"
    #   LOBBY_NAME: "Amiga Friday"        # shown in the launcher's Net Play browser
    #   PRESENCE: "1"                     # show browsers who else is online
    restart: unless-stopped
