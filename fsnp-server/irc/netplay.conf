# InspIRCd connect class for FS-UAE netplay, mounted into the image's conf.d
# by compose.yaml. The image includes conf.d before its own <connect> block,
# so this one takes priority.
#
# The launcher syncs a game's config as one channel message per setting, sent
# back to back, and resends it whenever a player joins. The image's defaults
# (commandrate 1000 = one message per second after a burst of threshold=10,
# and a 10 KB recvq) delay that by about 40 seconds for the 48 synced
# settings, and a long config can overrun recvq and disconnect the op.
# Measured: 80 messages took 71.5 s on the defaults, under 0.1 s with this.
<connect name="netplay"
         allow="*"
         commandrate="100000"
         threshold="200"
         fakelag="yes"
         recvq="64K"
         softsendq="64K"
         hardsendq="1M"
         localmax="10"
         globalmax="10"
         pingfreq="2m"
         timeout="20">
