[tool.black]
line-length = 79

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["F401", "F811", "F841", "UP031", "UP032"]

[tool.ruff.lint.per-file-ignores]
# Package re-exports. fsui/qt/qt.py is re-exported whole through
# "from fsui.qt.qt import *", and fsui/qt/signal.py re-exports Signal.
"__init__.py" = ["F401"]
"fsui/qt/qt.py" = ["F401"]
"fsui/qt/signal.py" = ["F401"]
