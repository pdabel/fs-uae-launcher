[tool.black]
line-length = 79

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
# Ruff's defaults (pycodestyle errors and Pyflakes), plus string formatting.
select = ["E4", "E7", "E9", "F", "UP031", "UP032"]

[tool.ruff.lint.per-file-ignores]
# Package re-exports. fsui/qt/qt.py is the Qt import surface, re-exported
# whole through "from fsui.qt.qt import *" after QtPy picks the binding;
# fsui/qt/signal.py re-exports Signal and fsbc/desktop.py fstd.desktop.
"__init__.py" = ["F401", "F403"]
"fsui/qt/qt.py" = ["E402", "F401", "F403", "F405"]
"fsui/qt/signal.py" = ["F401"]
"fsbc/desktop.py" = ["F403"]

[tool.mypy]
python_version = "3.12"
packages = [
    "fsbc",
    "fsboot",
    "fsgs",
    "fspy",
    "fstd",
    "fsui",
    "launcher",
    "workspace",
]
# QtPy resolves to PySide6 (fsui.qt.qt sets QT_API); without this mypy mixes
# the bindings' types. `python -m qtpy mypy-args` prints the same flags.
always_true = ["PYSIDE6"]
always_false = ["PYQT5", "PYQT6", "PYSIDE2"]

[[tool.mypy.overrides]]
# Stricter: function bodies are checked even where the function has no
# annotations. Extended package by package.
module = ["launcher.netplay", "launcher.netplay.*"]
check_untyped_defs = true

[[tool.mypy.overrides]]
# Packages without type information.
module = [
    "CoreFoundation",
    "lhafile",
    "qtawesome",
    "Quartz",
    "win32api",
    "win32con",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Re-exports Qt with star imports from several QtPy modules, which define
# some of the same names.
module = "fsui.qt.qt"
disable_error_code = ["assignment", "misc"]

[tool.pytest.ini_options]
# A deprecated call into our own code fails the tests, wherever it runs;
# deprecations raised by third-party packages stay warnings.
filterwarnings = [
    "error::DeprecationWarning:(fsbc|fsboot|fsgs|fspy|fstd|fsui|launcher|workspace)(\\.|$)",
]
