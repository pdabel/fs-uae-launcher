name: CI

on:
  push:
    branches: # Publish build artifacts to storage
      - main
      - release-*
  pull_request: # validate build succeeds
    branches:
      - main
      - release-*
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref_name }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-python-format:
    name: Check Python string formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.2
      - run: ruff check

  build-linux:
    name: Build Linux
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: read
    secrets: inherit

  build-macos-x86:
    name: Build MacOS x86
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
    secrets: inherit

  build-container:
    name: Build Container image
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write # for docker/build-push-action to push to GHCR
    secrets: inherit

  build-source:
    name: Build Source bundle
    uses: ./.github/workflows/source.yml
    permissions:
      contents: read
    secrets: inherit

  check-netplay-server:
    name: Check Netplay Server
    uses: ./.github/workflows/netplay-server.yml
    permissions:
      contents: read
    secrets: inherit