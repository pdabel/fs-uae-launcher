name: Container
on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version tag to set'
        required: false
        default: 'edge'
      push:
        type: boolean
        description: 'Push the image (false only builds it)'
        required: false
        default: true
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Version tag to set'
        required: false
        default: 'edge'
      push:
        type: boolean
        description: 'Push the image (false only builds it)'
        required: false
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # for docker/build-push-action to push to GHCR
    env:
      # Every platform builds on every run, PRs included, so a change that
      # breaks one is caught before it reaches main.
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      # edge comes only from main, so a release-* branch's CI or a dispatch
      # from a feature branch can't replace it. A release pushes its version.
      # A release dry run passes push: false.
      PUSH: >-
        ${{ github.event_name != 'pull_request' && inputs.push
            && (inputs.version != 'edge' || github.ref == 'refs/heads/main') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No QEMU step: fsnp-server/Dockerfile builds with
      # FROM --platform=$BUILDPLATFORM and ships FROM scratch, so the Go
      # toolchain cross-compiles and nothing needs emulating.

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ env.PUSH == 'true' }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: workflow
          images: |
            name=ghcr.io/${{ github.repository_owner }}/fs-uae-netplay
          # latest is the newest release; edge is never latest.
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version != 'edge' }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-push
        with:
          file: fsnp-server/Dockerfile
          context: "fsnp-server"
          cache-from: type=gha,scope=fs-uae-netplay
          cache-to: type=gha,scope=fs-uae-netplay,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ env.PUSH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          annotations: ${{ env.PUSH == 'true' && steps.meta.outputs.annotations || '' }}
          target: base
          pull: true
          sbom: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' }}
