name: Container
on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version tag to set'
        required: false
        default: 'edge'
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Version tag to set'
        required: false
        default: 'edge'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # for docker/build-push-action to push to GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No QEMU step: fsnp-server/Dockerfile builds with
      # FROM --platform=$BUILDPLATFORM and ships FROM scratch, so the Go
      # toolchain cross-compiles and nothing needs emulating.

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event_name != 'pull_request' }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          context: workflow
          images: |
            name=ghcr.io/${{ github.repository_owner }}/fs-uae-netplay
          tags: |
            type=raw,value=${{ inputs.version }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-push
        with:
          file: fsnp-server/Dockerfile
          context: "fsnp-server"
          cache-from: type=gha,scope=fs-uae-netplay
          cache-to: type=gha,scope=fs-uae-netplay,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name != 'pull_request' && env.platforms || '' }}
          annotations: ${{ github.event_name != 'pull_request' && steps.meta.outputs.annotations || '' }}
          target: base
          pull: true
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' }}
