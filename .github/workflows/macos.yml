name: macOS
on:
  workflow_call:
    inputs:
      version:
        type: string
        description: 'Version to set in tarballs'
        required: false
        default: '0.0.0-edge'
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Version to set in tarballs'
        required: false
        default: '0.0.0-edge'

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  macOS_x86-64:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]

    steps:
      - name: Install brew packages
        run: |
          brew install dos2unix

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The macOS runner images do not have Go on PATH (Ubuntu ones do),
      # and fsbuild/build.sh needs it to build fsnp-server.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fsnp-server/go.mod
          cache: false

      - name: Install pip and pipenv
        run: |
          python -m pip install pipenv

      - name: Run pipenv sync --dev
        run: |
          pipenv --python "${{ steps.python.outputs.python-path }}"
          pipenv sync --dev

      - name: Check Python consistency
        run: |
          pipenv run ruff check
          pipenv run python -m pytest fsbuild/tests/test_python_support.py

      - name: Run Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pipenv run python -W default::DeprecationWarning -m pytest fsbc fstd fspy fsbuild/tests launcher/netplay launcher/tests

      - name: Run Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pipenv run python -m pytest fsui/test/test_qt6.py

      - name: Set base version
        run: |
          echo "BASEVERSION_FS=${{ inputs.version }}" > BASEVERSION.FS
        if: ${{ inputs.version }}

      - name: Update version
        run: |
          fsbuild/version

      - name: Bootstrap
        if: hashFiles('fsbuild/bootstrap') != ''
        run: |
          fsbuild/bootstrap

      - name: Configure
        if: hashFiles('fsbuild/configure') != ''
        run: |
          fsbuild/configure

      - name: Build
        run: |
          pipenv run fsbuild/build

      - name: Bundle
        run: |
          fsbuild/bundle

      - name: Archive
        run: |
          fsbuild/archive

      - name: Upload builds to artifact storage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS_x86-64-py${{ matrix.python-version }}-${{ inputs.version }}
          path: fsbuild/_dist/*
        if: github.event_name != 'pull_request'
