name: Dependency Audit

# Checks every package pinned in Pipfile.lock -- the runtime packages the
# bundles ship (default) and the build and test tools (develop) -- against
# the PyPI and OSV advisory databases with pip-audit, and fails on any known
# vulnerability. ci.yml runs it on every push and pull request; the weekly
# schedule catches an advisory published while the lock hasn't changed.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # Pinned here, not in the Pipfile, so pip-audit's own dependencies (pip
  # among them) stay out of the test environments. Bump by hand.
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  Dependency-Audit:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit Pipfile.lock
        run: |
          # Advisories to skip, as --ignore-vuln <ID> with a comment saying
          # why: only for a finding with no fixed release that can't affect
          # the launcher. Otherwise bump the package in Pipfile.lock.
          ignore=()

          status=0
          for section in default develop; do
            # The exact versions and hashes in the lock. Platform markers
            # are dropped, so macOS- or Windows-only packages are audited
            # too.
            jq -r --arg section "$section" '
              .[$section] | to_entries[]
              | "\(.key)\(.value.version) "
                + ([.value.hashes[] | "--hash=\(.)"] | join(" "))
            ' Pipfile.lock > "requirements-$section.txt"

            echo "### Pipfile.lock: $section" >> "$GITHUB_STEP_SUMMARY"
            rm -f audit.md
            if pip-audit --require-hashes --disable-pip \
                --progress-spinner off --desc off \
                --format markdown --output audit.md \
                "${ignore[@]}" --requirement "requirements-$section.txt"
            then
              echo "No known vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              echo "::error::Known vulnerabilities in Pipfile.lock ($section). Bump the packages listed in the job summary."
              if [ -f audit.md ]; then
                tee -a "$GITHUB_STEP_SUMMARY" < audit.md
              fi
            fi
          done
          exit "$status"
